<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Neon Emerald to Cyan Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="45%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Coin Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Shadow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base (Apple/Android standard super-ellipse) -->
  <rect x="16" y="16" width="480" height="480" rx="115" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="3" filter="url(#softShadow)"/>

  <!-- Ambient Glow Behind Icon -->
  <circle cx="256" cy="256" r="140" fill="url(#neonGrad)" opacity="0.18" filter="url(#neonGlow)"/>

  <!-- Modern Geometric Wallet / Vault Gem Shape -->
  <g transform="translate(256, 256) scale(1.15)">
    <!-- Base Diamond Prism Body -->
    <path d="M-80 -40 L0 -90 L80 -40 L70 65 L0 95 L-70 65 Z" fill="#1e293b" stroke="url(#neonGrad)" stroke-width="6" stroke-linejoin="round" opacity="0.95"/>
    
    <!-- Top Facet -->
    <path d="M-80 -40 L0 -90 L80 -40 L0 -25 Z" fill="url(#neonGrad)" opacity="0.4"/>
    
    <!-- Left Glass Wing -->
    <path d="M-80 -40 L0 -25 L0 95 L-70 65 Z" fill="url(#neonGrad)" opacity="0.25"/>
    
    <!-- Right Glass Wing -->
    <path d="M80 -40 L0 -25 L0 95 L70 65 Z" fill="url(#neonGrad)" opacity="0.55"/>

    <!-- Central Glowing Coin / Core -->
    <circle cx="0" cy="5" r="32" fill="url(#accentGrad)" filter="url(#neonGlow)"/>
    <circle cx="0" cy="5" r="24" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="3"/>
    
    <!-- Minimalist Sparkle / Growth Arrow in Center -->
    <path d="M-10 12 L0 -8 L10 12 L0 6 Z" fill="url(#goldGrad)"/>
    
    <!-- Dynamic Upward Sparkles -->
    <circle cx="-50" cy="-45" r="4" fill="#34d399" opacity="0.9"/>
    <circle cx="55" cy="-55" r="5" fill="#38bdf8" opacity="0.9"/>
    <path d="M45 -70 Q45 -85 55 -85 Q45 -85 45 -100 Q45 -85 35 -85 Q45 -85 45 -70 Z" fill="#67e8f9" opacity="0.85"/>
  </g>
</svg>